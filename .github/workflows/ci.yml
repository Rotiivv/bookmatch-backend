name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    env:
      # O .env nao e versionado. O prisma7.config.ts exige DATABASE_URL para
      # carregar, mas o prisma generate nao se conecta ao banco.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  espelhar:
    name: Espelhar main em BookMatchTeam/bookmatch:backend
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: espelhar-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Historico completo: o GitHub recusa push de um clone raso.
          fetch-depth: 0

      - name: Enviar para a branch backend
        env:
          DEPLOY_KEY: ${{ secrets.BOOKMATCH_TEAM_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::Secret BOOKMATCH_TEAM_DEPLOY_KEY nao configurado; espelhamento ignorado."
            exit 0
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          # Sem --force: se alguem alterar a branch backend diretamente,
          # o envio falha em vez de apagar esse trabalho.
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            git push git@github.com:BookMatchTeam/bookmatch.git HEAD:refs/heads/backend
