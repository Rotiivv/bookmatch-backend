# Etapa 1: proxy reverso em HTTP.
#
# O Nginx recebe o pedido na porta 80 do container (8080 no seu computador)
# e repassa para a API, que escuta na porta 3000 dentro da rede do Docker.
#
# Equivalente no Caddyfile:  reverse_proxy api:3000

server {
    # Porta em que o Nginx escuta, dentro do container.
    listen 80;
    # Para qual dominio este bloco responde.
    server_name localhost;

    # "location /" vale para qualquer caminho: /health, /api/docs...
    location / {
        # Para onde repassar. "api" e o nome do servico no compose.yaml.
        proxy_pass http://api:3000;

        # Sem estas linhas, a API acharia que todo pedido veio do Nginx.
        # Host:              o dominio que o cliente digitou
        # X-Real-IP:         o IP de quem fez o pedido
        # X-Forwarded-For:   a lista de IPs por onde o pedido passou
        # X-Forwarded-Proto: se o cliente usou http ou https
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
