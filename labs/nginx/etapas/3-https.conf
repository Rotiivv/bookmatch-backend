# Etapa 3: HTTPS com um certificado autoassinado.
#
# Dois blocos server:
# - porta 80: so redireciona para o HTTPS;
# - porta 443: decifra o HTTPS e repassa para a API (em HTTP, dentro da rede).
#
# O certificado foi gerado por voce (docker compose run --rm certificado).
# Ele cifra a conexao, mas nenhuma autoridade confia nele, por isso o
# navegador avisa "conexao nao segura". E esse o problema que o Let's Encrypt
# resolve, e o Caddy faz isso sozinho.

server {
    listen 80;
    server_name localhost;

    # 301 = "mudou de endereco para sempre".
    # No laboratorio o HTTPS esta na 8443; na VPS seria https://$host$request_uri
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Certificado (publico, enviado ao cliente) e chave privada (fica aqui).
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    # Versoes antigas do TLS tem falhas conhecidas.
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $api http://api:3000;
        proxy_pass $api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
