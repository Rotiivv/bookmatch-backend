# Etapa 2: corrigindo o 502 depois de um deploy.
#
# Na etapa 1, o Nginx descobre o IP de "api" UMA vez, quando liga, e guarda
# para sempre. Quando o container da API e recriado (todo deploy), ele ganha
# outro IP, e o Nginx continua mandando para o antigo: 502 Bad Gateway.
#
# Correcao: usar o DNS interno do Docker e por o endereco numa variavel.
# Com variavel, o Nginx pergunta o IP de novo enquanto atende os pedidos.

server {
    listen 80;
    server_name localhost;

    # 127.0.0.11 e o DNS que o Docker coloca dentro de todo container.
    # valid=10s: guarda a resposta por 10 segundos e depois pergunta de novo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $api http://api:3000;
        proxy_pass $api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
