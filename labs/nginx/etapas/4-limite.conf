# Etapa 4: limite de requisicoes por IP (o que o Caddy nao tem pronto).
#
# Protege, por exemplo, uma futura rota de login contra quem tenta milhares
# de senhas por minuto.

# Uma "zona" de memoria que conta pedidos por IP.
# $binary_remote_addr: o IP do cliente (forma compacta)
# 10m:                 10 MB de memoria, cabem ~160 mil IPs
# rate=5r/s:           5 pedidos por segundo por IP
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=5r/s;
# Quem passar do limite recebe 429 Too Many Requests (o padrao seria 503).
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # burst=10: tolera uma rajada de ate 10 pedidos acima do ritmo.
        # nodelay:  atende a rajada na hora em vez de enfileirar.
        limit_req zone=por_ip burst=10 nodelay;

        set $api http://api:3000;
        proxy_pass $api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
